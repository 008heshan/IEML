# IEML 在 CNB 上的 CI（云原生构建）—— 与 `.github/workflows/ci.yml` 的 Linux 作业**同一条命令**。
#
# ★ 为什么两个地方都有 CI
#   `cnb.cool` 是这个项目**主仓**（更新端点也在这里），推送权限本来就有；
#   而 GitHub 那边的 workflow 文件需要凭据带 `workflow` 权限，本机那把没有
#   （GitHub 原话：`refusing to allow an OAuth App to create or update workflow
#   .github/workflows/ci.yml without workflow scope`）。所以先在这里把
#   "每次推送都真的跑一遍"落地 —— 一份放着的配置没跑过，等于没有 CI。
#
# ★ 这条流水线**只覆盖可移植子集**
#   跑 `node tools/verify.mjs --skip-rust`：类型检查 / 前端测试 / 静态门禁 / 前端构建。
#   **Rust 那两项不在里面**（它们要 Windows 的 powershell + MSVC，见 docs/VERSIONING.md
#   的平台口径）。脚本自己会把跳过的两项印在输出与总结里 —— 绿了也**不等于** Rust 侧绿了。
#
# ★★ 结果**必须留下可读的痕迹**（`endStages` + `tools/ci/report-status.mjs`）
#   日志只在网页上看得见，而本机凭据**没有构建查询权限**
#   （`NO_RIGHT Token scope not match`）—— 一份"跑过了但谁也看不见"的 CI
#   与没有 CI 的区别只在心理上。所以用 `endStages`（**无论成败都会跑**，
#   那里能读到 `${CNB_PIPELINE_STATUS}`）把结果连同日志尾部与构建链接
#   写成 `ci-status` release 上的 `ci-status.json` —— 那个资产用仓库凭据就能读。
#
# ★ 判定权只在 `verify.mjs` 的退出码上
#   所以那一步**不用管道**（`cmd | tee` 在 sh 里会把退出码换成 tee 的 0，
#   那等于给自己放行）：直接重定向到日志文件，失败就当场红；
#   日志尾巴由 endStages 上报，红了同样看得到。
#
# ★ 两条与"仓库根要干净"有关的细节（第一版就是被它们红的，门禁是对的）：
#   · `pnpm install --store-dir …`：容器里 pnpm 默认会把 store 建在**工作区里**
#     （第一版：仓库根多了一个 `.pnpm-store/`），必须指到仓库外；
#   · 日志与状态文件写 `/tmp`，**不写仓库里的 `tmp/`** ——
#     `tmp/` 在白名单里但只允许空着（见 `tools/gates/check-repo-root.mjs`）。
#
# ★ 镜像钉版本：本机是 Node 24.9.0 / pnpm 10.34.5，这里显式装 10.34.5
#   （与 `.github/workflows/ci.yml` 一致），`--frozen-lockfile` 才不会白设。

main:
  push:
    - name: 可移植子集（类型检查 / 前端 / 门禁 / 构建，不含 Rust）
      docker:
        image: node:24
      stages:
        - name: 环境信息（先印出来，红了才知道是哪套版本红的）
          script: |
            node -v
            npm -v
            corepack enable
            corepack prepare pnpm@10.34.5 --activate
            pnpm -v
        - name: 装依赖（store 指到仓库外）
          script: |
            pnpm install --frozen-lockfile --store-dir /tmp/pnpm-store
        - name: 可移植子集（node tools/verify.mjs --skip-rust）
          script: |
            node tools/verify.mjs --skip-rust > /tmp/ci-verify.log 2>&1
            tail -40 /tmp/ci-verify.log
      endStages:
        - name: 把结果与日志尾部写成可读的产物（成功/失败都写）
          script: |
            node tools/ci/report-status.mjs --status "${CNB_PIPELINE_STATUS}" --log /tmp/ci-verify.log \
              || echo "[ci] 状态上报没成功（不影响判定：判定看的是上面那一步的退出码）"
  pull_request:
    - name: 可移植子集（PR 同样要过）
      docker:
        image: node:24
      stages:
        - name: 装依赖（store 指到仓库外）
          script: |
            corepack enable
            corepack prepare pnpm@10.34.5 --activate
            pnpm install --frozen-lockfile --store-dir /tmp/pnpm-store
        - name: 可移植子集（node tools/verify.mjs --skip-rust）
          script: |
            node tools/verify.mjs --skip-rust > /tmp/ci-verify.log 2>&1
            tail -40 /tmp/ci-verify.log
      endStages:
        - name: 把结果与日志尾部写成可读的产物（成功/失败都写）
          script: |
            node tools/ci/report-status.mjs --status "${CNB_PIPELINE_STATUS}" --log /tmp/ci-verify.log \
              || echo "[ci] 状态上报没成功（不影响判定）"
