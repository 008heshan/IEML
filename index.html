<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>IEML — 极简 Minecraft 启动器</title>
    <style>
      /* 首屏防闪烁：在 CSS 加载前就把底色定下来 */
      html, body { margin: 0; background: #0b0d10; }
      #splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px;
        background: #0b0d10; z-index: 9999;
      }
      #splash img { width: 64px; height: 64px; }
      #splash .txt { color: #888; font: 13px system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="/src/assets/brand-icon.png" alt="" />
      <div class="txt">IEML</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
